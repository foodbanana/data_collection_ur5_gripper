# =============================================================
# drone_iris_pegasus.yaml — PX4 SITL 기준선 (PLAN 2단계 2번 P-2): Pegasus Iris 원래 크기·질량 + PX4 gazebo-classic_iris
#   Pegasus PX4 예제와 같은 조건으로 연결을 확인하는 용도 (기체 = PX4 airframe 파라미터와 같은 Iris).
#   drone_iris.yaml 을 복사해 scale 1.0, 질량 1.52 kg (body 1.5 원본 + 프로펠러 0.005 × 4), backend px4 만 바꿈
#   (잡는 폭 약 105 mm 라 그리퍼로는 잡을 수 없음 → 비행 시험 전용)
# =============================================================

usd: assets/drones/iris/iris.usd   # isaacsim/ 기준 상대 경로
name: Iris
body_link: body                    # 중심 강체 (최상위 prim 기준 상대 경로). 공중 유지 힘을 거는 링크, 잡는 곳

# 0.75 배: 원본 허리 폭 105 mm → 약 79 mm (그리퍼 열림 107 − 여유 2 × 10 = 87 mm 이하). 전체 폭 약 36 cm
scale: 1.0

mass: 1.52
# 링크 질량 [kg] (최상위 prim 기준 상대 경로). 합계 = mass 여야 함. 원본 body 1.5 kg, 프로펠러 미지정
link_masses:
  body: 1.5
  rotor0: 0.005
  rotor1: 0.005
  rotor2: 0.005
  rotor3: 0.005

# 프로펠러 회전 관절 → FixedJoint (원래 관절 비활성화). 프로펠러를 보여 주기용으로 돌릴 때(--prop-spin on)는
#   flight.prop_joints 에 있는 관절은 고정하지 않는다
lock_joints: [rotor0/joint0, rotor1/joint1, rotor2/joint2, rotor3/joint3]

zero_initial_velocity: true        # 원본에 저장된 초기 속도(rotor0 9.4 rad/s 등)를 0 으로

# 바닥에 놓였을 때 기울기 허용 [degree]: 앞쪽 아래 안테나(드론 좌표 x 73, y 49 mm)가 다리 끝보다 10 mm 더 내려와
#   안테나 + 다리로 3.4° 기울어져 섬 (원본 형상, 2026-10-01 check_drone)
rest_tilt_max_deg: 5.0

articulation:
  sleep_threshold: 0.0             # 공중에 떠 있는 동안 잠들지 않게

# 비행 (Pegasus Simulator 방식, scripts/drone_flight.py, PLAN 2-2)
#   제어기(지금은 기하 제어기, 나중에 PX4) → 로터 4 개 목표 각속도 ω → 추력 Fᵢ = k·ωᵢ² 을 각 로터 강체 z 축으로,
#   반토크 Σ c·ωᵢ²·dirᵢ 와 선형 공기저항을 body 에. 모터 정지(release) = ω 0
#   추력 모델 값은 Pegasus Iris 기본값 (QuadraticThrustCurve, LinearDrag) 그대로
flight:
  # 제어기: geometric (Pegasus 예제 기하 제어기, 아래 controller) | px4 (PX4 SITL, 아래 px4 절, PLAN 2단계 2번)
  backend: px4
  rotors: [rotor0, rotor1, rotor2, rotor3]     # 추력을 거는 강체 (최상위 prim 기준). 순서 = rot_dir 순서 = PX4 모터 순서
  rot_dir: [-1, -1, 1, 1]                      # 회전 방향 (Pegasus Iris: rotor0·1 과 rotor2·3 이 대각선 쌍)
  rotor_constant: 8.54858e-6                   # k [N/(rad/s)²]
  rolling_moment_coefficient: 1.0e-6           # c [N·m/(rad/s)²]
  max_rotor_velocity: 1100.0                   # rad/s → 로터당 최대 약 10.3 N (0.8 kg 무게 7.8 N 의 5.3 배)
  linear_drag: [0.50, 0.30, 0.0]               # body 좌표계 속도에 곱하는 계수 [N·s/m]
  # 프로펠러 회전 (보여 주기용, Pegasus handle_propeller_visual 과 같음): 실제 ω 와 무관하게 로터 추력이
  #   0.1 N 이상이면 visual_speed, 0 초과 0.1 N 미만이면 idle_speed, 0 이면 정지. 방향은 rot_dir
  prop_joints: [rotor0/joint0, rotor1/joint1, rotor2/joint2, rotor3/joint3]
  prop_visual_speed: 100.0                     # rad/s
  prop_idle_speed: 5.0                         # rad/s
  # 기하 제어기 = Pegasus 예제 NonlinearController 그대로 (식·한 step 지연). 게인 = Pegasus 값을 우리 기체로 환산
  #   (2026-10-01 사용자 결정: 오차가 조금 크더라도 Pegasus 와 같은 동작이 실제에 가깝다)
  #   Pegasus 게인을 그대로 쓰면 관성이 6~9 배 작은 우리 드론에서 자세 제어가 너무 세져 로터 명령이 매 step 크게 흔들림
  #   (정지 호버 오차 9.9 mm, 기울기 1.5°, 로터 ω 평균 363 vs 호버 479 rad/s, Kw·dt/I 최대 1.29) → Pegasus Iris 와 같은 응답이 되도록
  #   Kp·Kd·Ki × (m / m_ref), Kr·Kw × (I / I_ref) (축별). 환산 후 정지 오차 0.56 mm, 기울기 0°, ω 478.9
  #   m, I 는 PhysX 값 (전체 무게중심 둘레). reference = Pegasus Iris (NonlinearController m 1.5, iris.usd body diagonalInertia)
  controller:
    Kp: [10.0, 10.0, 10.0]
    Kd: [8.5, 8.5, 8.5]
    Ki: [1.50, 1.50, 1.50]
    Kr: [3.5, 3.5, 3.5]
    Kw: [0.5, 0.5, 0.5]
    scale_to_airframe: true
    reference_mass: 1.5
    reference_inertia: [0.029125, 0.029125, 0.055225]
  # hover 모드: 목표 위치에 축별 사인파 합을 더함 (주파수·위상은 seed 로 뽑아 기록)
  hover:
    amplitude: [0.02, 0.02, 0.01]              # m
    freq_range: [0.2, 0.5]                     # Hz
    n_sines: 2                                 # 축마다 사인파 개수

# 잡는 곳: 몸체 옆면, 폭(y) 방향으로 닫음, 아래에서 위로 접근 (2-4 파지 시퀀스가 씀)
grasp:
  approach: [0.0, 0.0, 1.0]
  close_axis: [0.0, 1.0, 0.0]
  center_xy: [0.0, 0.0]            # 허리 (원본 x = 0 단면이 가장 좁음)

# PX4 SITL (flight.backend: px4 일 때, scripts/px4_bridge.py). 모터 명령 u (0~1) → ω = (u + input_offset)·input_scaling + zero_position_armed
#   (Pegasus PX4MavlinkBackendConfig 기본값)
px4:
  sitl_config: config/px4_sitl.yaml
  airframe: gazebo-classic_iris        # PX4 ROMFS init.d-posix/airframes/10015_gazebo-classic_iris (Pegasus 기본)
  input_offset: [0.0, 0.0, 0.0, 0.0]
  input_scaling: [1000.0, 1000.0, 1000.0, 1000.0]
  zero_position_armed: [100.0, 100.0, 100.0, 100.0]
  rotor_geometry_from_sim: false       # 기준선: PX4 Iris 값 그대로
  downward_sensor_position: [0.0, 0.0, 0.0]   # m, body 좌표계 (flow 일 때)
  rate_gain_scaling: {enabled: false}  # 기준선: PX4 Iris 게인 그대로 (P-2: USD 관성으로는 17 Hz 진동, PLAN 참고)
  # 모터 1차 지연 (PX4 Gazebo motor_model timeConstantUp/Down 기본값). Pegasus 에는 없음 → 기준선은 끔
  motor_dynamics: {enabled: false, tau_up: 0.0125, tau_down: 0.025}
  sensor_kinematics: physx_velocity      # 기준선: Pegasus 와 같이 PhysX 속도
  sensor_overrides: {pegasus_compat: true}   # 기준선: Pegasus 센서 코드 동작 그대로 (버그 포함)
  params: {}                           # PX4 파라미터 덮어쓰기 (PX4_PARAM_<이름>)
