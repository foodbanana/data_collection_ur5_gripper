# =============================================================
# drone_iris.yaml — 2단계 데모 드론: 3DR Iris (PX4 기본 기체 외형) 0.75 배 (docs/PLAN.md 2단계)
#
# 원본 USD(isaacsim/assets/drones/iris/, README 참고)는 그대로 두고 씬 레이어에서 덮어쓴다 (drone.add_drone):
#   축소, 링크 질량, 프로펠러 관절 고정(FixedJoint), 저장된 초기 속도 0, 물체 재질
# 실물: 접이식 소형 쿼드콥터 0.8 kg, 그리퍼가 아래에서 위로 다가가 몸체 옆면을 폭 방향으로 잡는다
#
# 좌표: 드론 좌표계 = 드론 최상위 prim 의 위치·자세 (축소 반영된 m 단위), +x 앞, +y 왼쪽, +z 위
# =============================================================

usd: assets/drones/iris/iris.usd   # isaacsim/ 기준 상대 경로
name: Iris
body_link: body                    # 중심 강체 (최상위 prim 기준 상대 경로). 공중 유지 힘을 거는 링크, 잡는 곳

# 0.75 배: 원본 허리 폭 105 mm → 약 79 mm (그리퍼 열림 107 − 여유 2 × 10 = 87 mm 이하). 전체 폭 약 36 cm
scale: 0.75

mass: 0.8                          # 총 질량 (실물)
# 링크 질량 [kg] (최상위 prim 기준 상대 경로). 합계 = mass 여야 함. 원본 body 1.5 kg, 프로펠러 미지정
link_masses:
  body: 0.78
  rotor0: 0.005
  rotor1: 0.005
  rotor2: 0.005
  rotor3: 0.005

# 프로펠러 회전 관절 → FixedJoint (원래 관절 비활성화). 프로펠러를 보여 주기용으로 돌릴 때(--prop-spin on)는
#   flight.prop_joints 에 있는 관절은 고정하지 않는다
lock_joints: [rotor0/joint0, rotor1/joint1, rotor2/joint2, rotor3/joint3]

zero_initial_velocity: true        # 원본에 저장된 초기 속도(rotor0 9.4 °/s 등, USD 각속도 속성은 degree/s)를 0 으로

# 바닥에 놓였을 때 기울기 허용 [degree]: 앞쪽 아래 안테나(드론 좌표 x 73, y 49 mm)가 다리 끝보다 10 mm 더 내려와
#   안테나 + 다리로 3.4° 기울어져 섬 (원본 형상, 2026-10-01 check_drone)
rest_tilt_max_deg: 5.0


articulation:
  sleep_threshold: 0.0             # 공중에 떠 있는 동안 잠들지 않게

# 비행 (Pegasus Simulator 방식, scripts/drone_flight.py, PLAN 2-2)
#   제어기(지금은 기하 제어기, 나중에 PX4) → 로터 4 개 목표 각속도 ω → 추력 Fᵢ = k·ωᵢ² 을 각 로터 강체 z 축으로,
#   반토크 Σ c·ωᵢ²·dirᵢ 와 선형 공기저항을 body 에. 모터 정지(release) = ω 0
#   추력 모델 값은 Pegasus Iris 기본값 (QuadraticThrustCurve, LinearDrag) 그대로
flight:
  # 제어기: geometric (Pegasus 예제 기하 제어기, 아래 controller) | px4 (PX4 SITL, 아래 px4 절, PLAN 2단계 2번)
  #   기본 px4 (2026-10-02 사용자 결정: 잡을 때 실물처럼 제어기가 버팀). 기하 제어기는 --flight geometric (이륙 없이 바로 시작)
  backend: px4
  rotors: [rotor0, rotor1, rotor2, rotor3]     # 추력을 거는 강체 (최상위 prim 기준). 순서 = rot_dir 순서 = PX4 모터 순서
  rot_dir: [-1, -1, 1, 1]                      # 회전 방향 (Pegasus Iris: rotor0·1 과 rotor2·3 이 대각선 쌍)
  rotor_constant: 8.54858e-6                   # k [N/(rad/s)²]
  rolling_moment_coefficient: 1.0e-6           # c [N·m/(rad/s)²]
  max_rotor_velocity: 1100.0                   # rad/s → 로터당 최대 약 10.3 N (0.8 kg 무게 7.8 N 의 5.3 배)
  linear_drag: [0.50, 0.30, 0.0]               # body 좌표계 속도에 곱하는 계수 [N·s/m]
  # 프로펠러 회전 (보여 주기용, Pegasus handle_propeller_visual 과 같음): 실제 ω 와 무관하게 로터 추력이
  #   0.1 N 이상이면 visual_speed, 0 초과 0.1 N 미만이면 idle_speed, 0 이면 정지. 방향은 rot_dir
  prop_joints: [rotor0/joint0, rotor1/joint1, rotor2/joint2, rotor3/joint3]
  prop_visual_speed: 100.0                     # rad/s
  prop_idle_speed: 5.0                         # rad/s
  # 기하 제어기 = Pegasus 예제 NonlinearController 그대로 (식·한 step 지연). 게인 = Pegasus 값을 우리 기체로 환산
  #   (2026-10-01 사용자 결정: 오차가 조금 크더라도 Pegasus 와 같은 동작이 실제에 가깝다)
  #   Pegasus 게인을 그대로 쓰면 관성이 6~9 배 작은 우리 드론에서 자세 제어가 너무 세져 로터 명령이 매 step 크게 흔들림
  #   (정지 호버 오차 9.9 mm, 기울기 1.5°, 로터 ω 평균 363 vs 호버 479 rad/s, Kw·dt/I 최대 1.29) → Pegasus Iris 와 같은 응답이 되도록
  #   Kp·Kd·Ki × (m / m_ref), Kr·Kw × (I / I_ref) (축별). 환산 후 정지 오차 0.56 mm, 기울기 0°, ω 478.9
  #   m, I 는 PhysX 값 (전체 무게중심 둘레). reference = Pegasus Iris (NonlinearController m 1.5, iris.usd body diagonalInertia)
  controller:
    Kp: [10.0, 10.0, 10.0]
    Kd: [8.5, 8.5, 8.5]
    Ki: [1.50, 1.50, 1.50]
    Kr: [3.5, 3.5, 3.5]
    Kw: [0.5, 0.5, 0.5]
    scale_to_airframe: true
    reference_mass: 1.5
    reference_inertia: [0.029125, 0.029125, 0.055225]
  # hover 모드: 목표 위치에 축별 사인파 합을 더함 (주파수·위상은 seed 로 뽑아 기록). 프리셋 이름으로 고른다 (--hover small|mid|big, 2026-10-16 사용자 결정 (가))
  #   축마다 사인파 n_sines 개, 진폭 = amplitude / n_sines 씩 (합의 최대 = amplitude), 주파수는 freq_range 에서 균등, 위상 0 ~ 2π
  #   sim_ros2 리셋마다 주파수·위상을 다시 뽑는다 (seed = --seed + 리셋 횟수). 최대 속도 ≈ 2π · freq 최대 · amplitude
  #   GUI 로 세 가지를 보고 정함 (2026-10-16). 작업명을 프리셋마다 나눠 모은다
  hover_presets:
    small:                                     # 빠르게 떨림 (예전 hover 값 그대로, check_flight F3), 최대 약 6 cm/s
      amplitude: [0.02, 0.02, 0.01]            # m
      freq_range: [0.2, 0.5]                   # Hz
      n_sines: 2
    mid:                                       # 느리고 크게, 최대 약 6 cm/s
      amplitude: [0.03, 0.03, 0.015]
      freq_range: [0.05, 0.3]
      n_sines: 2
    big:                                       # 최대 약 9 cm/s
      amplitude: [0.05, 0.05, 0.02]
      freq_range: [0.05, 0.3]
      n_sines: 2

# 잡는 곳: 몸체 옆면, 폭(y) 방향으로 닫음, 아래에서 위로 접근 (2-4 파지 시퀀스가 씀)
grasp:
  approach: [0.0, 0.0, 1.0]
  close_axis: [0.0, 1.0, 0.0]
  center_xy: [0.0, 0.0]            # 허리 (원본 x = 0 단면이 가장 좁음)

# 잡는 곳 표시 = 빨간 테이프 (PLAN 6단계 "수집 전 확인", 2026-10-16 사용자 결정: 빨강, 손가락이 닿는 곳 + 아랫면으로 조금 감쌈). 실물 드론에도 같은 자리에 붙인다
#   실물에서 테이프를 옆면 위쪽에서 아래로 붙이고 아랫면 가장자리까지 팽팽하게 감은 모양: 손가락 폭 띠 (|x| ≤ half_width) 를 grid 간격 단면으로 잘라
#   단면마다 볼록 껍질을 따라 옆면 z = z_max 에서 모서리를 돌아 아랫면 |y| = bottom_inner 까지 한 장으로 잇고 offset 만큼 띄운 얇은 막.
#   구멍·홈 위는 건너고 돌기는 덮는다 (2026-10-16: 메시 면을 그대로 쓰면 손목 영상에서 띠 안에 검은 점 2 ~ 15 %, 높이 지도로 메우면 옆면·아랫면 이음매가 비침)
#   보이기만 함 (충돌·질량 없음, 파지 물리 그대로). 좌표 = 드론 좌표계 (축소 반영 m), x·y 는 grasp.center_xy 기준
#   손가락 파지면이 닿는 높이 = z −1 ~ +20 mm (PX4 파지 실측, 2026-10-16), 옆면은 z −23 ~ +25 mm 에서 거의 수직, 아랫면 z ≈ −31 mm (|y| ≤ 25 mm)
#   → 위 끝 22 mm. 아랫면 감쌈 = 손목 카메라 (아래에서 봄) 에 보이게 (옆면만이면 안 보임, 2026-10-16 GUI 확인). 손가락 폭 26 mm → 폭 40 mm.
#   끄려면 grasp_marker: null (항목이 없으면 에러)
grasp_marker:
  color: [0.65, 0.02, 0.02]        # 진한 빨강 (linear RGB). 파랑은 sim 앞 프로펠러 (Linen_Blue)·실물 UR5 관절 덮개 (하늘색) 와 겹쳐 바꿈. 실물 테이프를 정하면 맞춤
  roughness: 0.8                   # 무광 테이프
  half_width: 0.020                # m, x 방향 반폭 (테이프 폭 40 mm)
  z_max: 0.022                     # m, 옆면 위 끝
  bottom_inner: 0.020              # m, 아랫면에서 테이프 안쪽 끝 (잡는 곳 가운데에서 닫는 방향 거리)
  grid: 0.001                      # m, 단면 간격·단면 위 점 간격
  offset: 0.0005                   # m, 껍질에서 띄우는 거리 (겹쳐 깜빡이지 않게)

# PX4 SITL (flight.backend: px4 또는 --flight px4 일 때, scripts/px4_bridge.py, PLAN 2단계 2번 P-3)
#   모터 명령 u (0~1) → ω = (u + input_offset)·input_scaling + zero_position_armed (Pegasus 기본값, 호버 ω 479 → u ≈ 0.38)
px4:
  sitl_config: config/px4_sitl.yaml
  airframe: gazebo-classic_iris        # PX4 ROMFS init.d-posix/airframes/10015_gazebo-classic_iris
  input_offset: [0.0, 0.0, 0.0, 0.0]
  input_scaling: [1000.0, 1000.0, 1000.0, 1000.0]
  zero_position_armed: [100.0, 100.0, 100.0, 100.0]
  rotor_geometry_from_sim: true        # CA_ROTORi_PX/PY ← sim 로터 위치 (0.75 배)
  downward_sensor_position: [0.0, 0.0, 0.0]   # m, body 좌표계. 하향 거리 센서·flow 위치 (광축 = body −z). 바닥에 놓이면 약 4 cm
  # 각속도 게인 환산: MC_{ROLL,PITCH,YAW}RATE_K = (I / I_ref) ÷ (팔 / 팔_ref) (축별, drone_flight._px4_airframe_params)
  #   기준 = P-2 에서 안정 확인한 조합 (2026-10-02): Gazebo Iris 관성 + Pegasus 추력 모델 + Pegasus Iris 로터 위치 → ω 표준편차 1.3 rad/s
  #   (PhysX 가 충돌 형상에서 계산한 관성으로는 PX4 Iris 게인이 너무 세서 17 Hz 포화 진동. iris.usd 에 저장된 관성은 Gazebo Iris 값과 같지만
  #    drone.add_drone 이 link_masses 가 있으면 지운다, PLAN P-2 정정 2026-10-07)
  rate_gain_scaling:
    enabled: true
    reference_inertia: [0.029125, 0.029125, 0.055225]   # kg·m², PX4 Gazebo Iris (sitl_gazebo iris.sdf)
    reference_arm_xy: [0.13135, 0.21265]                 # m, Pegasus Iris (1.0 배) 로터 |x|·|y| 평균 (FRD, P-2 측정)
  # 모터 1차 지연 (PX4 Gazebo motor_model timeConstantUp/Down 기본값). Pegasus 에는 없음 → 기준선은 끔
  motor_dynamics: {enabled: true, tau_up: 0.0125, tau_down: 0.025}
  sensor_kinematics: pose_difference     # IMU·flow 속도 = 자세·위치 차분 (잡혔을 때 PhysX 속도가 실제 움직임과 다름, PLAN P-7)
  sensor_overrides: {}                 # px4_sitl.yaml sensors 덮어쓰기 (기체별)
  params: {}                           # PX4 파라미터 덮어쓰기 (PX4_PARAM_<이름>, 위 자동값보다 우선)

