# =============================================================
# grasp_demo.yaml — 2단계 스크립트 파지 데모·자동 판정 (docs/PLAN.md 2-4, scripts/grasp_demo.py)
#
# 시퀀스 (텔레옵 흉내, 팔 관절 목표를 control_hz 로 보냄):
#   S1 관절 보간으로 seed_pose → 차분 IK 로 접근 전 자세 (잡는 자세에서 pregrasp_below 아래)
#   S2 수직 상승 (approach_speed) → S3 그리퍼 닫기 → S4 드론 모터 정지, hold_time 동안 버팀 → S5 끝 (end_wait 유지)
#   실물: 잡은 뒤 모터를 멈추고 사람이 떼어 감 → 내려놓기는 하지 않음 (2026-10-01. 착륙 받침대는 팔뚝·손목이 막혀 제거,
#   내려놓기·충돌 없는 경로는 나중에 MoveIt 등 경로 계획으로)
# 길이 m, 속도 m/s, 각도 rad (판정 기준은 이름에 단위)
# =============================================================

control_hz: 50
max_dq_per_tick: 0.063        # rad, 한 제어 주기 최대 관절 변화 (1-5: 50 Hz 텔레옵 명령 변화 상한, 큰 스텝 오버슈트 방지)
ik_damping: 0.02
# S1 관절 보간 목표: 그리퍼 +z, 드론 기본 위치 아래 21 cm (2-3 FK 탐색). 드론 위치가 달라도 여기서 IK 로 이어 감
#   wrist_1 = 1.3963 − 2π: 홈(−π/2)에서 +1.3963 쪽으로 돌리면 그리퍼가 팔에 걸려 0.21 rad 에서 막힘 (2026-10-01).
#   반대 방향(−4.8869)으로 돌리면 같은 자세에 도달 (관절 오차 0.03°)
seed_pose: [-0.1888, -0.7854, 0.9599, -4.8869, -1.5708, 0.1888]
joint_speed: 0.5              # rad/s, S1
# 그리퍼 x 축 = 드론 −x (손목 카메라(그리퍼 +x 쪽 45~70 mm)를 드론 앞쪽 아래 안테나 반대쪽으로)
tool_x_in_drone: [-1.0, 0.0, 0.0]
pregrasp_below: 0.15
move_speed: 0.10              # S1 접근 전 자세로 가는 직선 이동
approach_speed: 0.03          # S2 수직 상승
# S2 동안 드론을 따라감 (텔레옵 조작자처럼): 잡는 높이까지 남은 높이가 이 값보다 크면 목표 = 지금 드론 기준 잡는 자세, 이하가 되면 그 순간 목표로 고정
#   (PX4 호버는 ±1~2 cm 로 천천히 움직여 시작 순간 목표로 고정하면 5 s 접근 중 18~22 mm 어긋나 손가락 끝이 몸체에 부딪힘, 2026-10-02.
#    닿은 뒤까지 따라가면 손가락이 민 드론을 끝없이 쫓아감, 2-4)
approach_track_until: 0.03
reach: {pos_tol: 0.0015, rot_tol_deg: 0.5, timeout: 8.0}
grip_close_timeout: 5.0
# 잡은(grasped) 뒤 드론 모터 정지(kill)까지 [s]. 실물: 잡힌 것을 확인하고 끔. 이 사이 드론 제어기가 그리퍼와 싸움 → 떨림 측정 구간
#   (2-4 결과는 0 = 잡자마자 정지. PX4 비교(PLAN 2단계 2번 P-7)부터 1.0, --kill-delay 로 바꿈)
kill_delay: 1.0
hold_time: 2.5                # s, 모터 정지 뒤 유지 (내려앉는 데 1~1.6 s, 2026-10-01)
end_wait: 2.0                 # s, held 뒤 그대로 유지 (실물은 여기서 사람이 떼어 감)

judge:
  stop_vel: 0.01              # rad/s, 그리퍼가 멈췄다고 보는 평균 속도 (위치 변화로 계산)
  stop_time: 0.2              # s
  empty_close_deg: 62.0       # 이 각도 이상 닫히면 빈손 (빈손 끝까지 64.2°, 1-6)
  contact_force: 1.0          # N, 손가락 한쪽 최소 접촉력
  # 모터 정지 뒤: 아래에서 잡아 무게가 실리면 드론이 손가락 위로 조금 내려앉은 뒤 멈춤 (2026-10-01 Iris 0.8 kg: 약 1~1.6 s 동안
  #   5~6 mm 내려앉고 그 뒤 0.1 mm 이하) → 내려앉음 총량과, 유지 시간 끝 still_window 동안 멈췄는지를 따로 본다
  hold_time: 2.5              # s (내려앉는 데 1~1.6 s 걸림 → 여유)
  settle_max_mm: 15.0         # 모터 정지 뒤 내려앉음 최대 (중앙 6 mm, 닫는 방향 10 mm 어긋나게 잡으면 8 mm)
  still_window: 0.5           # s
  still_mm: 0.5               # still_window 동안 변화 최대
  hold_rot_deg: 10.0          # 어긋나게 잡으면 모터 정지 뒤 2~5° 기울고 멈춤 (실행마다 다름, 2026-10-01) → 5° 는 경계
  drop_mm: 30.0               # 잡은 뒤 TCP 기준 드론이 이만큼 움직이면 떨어뜨림

# 판정기 검증 케이스 (--case). success 는 위 시퀀스 그대로
cases:
  # 어긋나게 잡기 (텔레옵은 중앙을 정확히 못 잡음): 한쪽 손가락이 먼저 닿아 드론을 민 뒤 반대쪽이 닿음 → 그래도 held 여야 함
  #   중앙을 잡으면 한쪽만 미는 시간이 0.017 s 라 드론이 약 1 mm 만 움직임 (2026-10-01)
  offset_y:                   # 손가락이 닫히는 방향(드론 y)으로 10 mm. 열린 손가락과 몸체 사이가 한쪽 13 mm 라 20 mm 면 올라가다 부딪힘
    tcp_offset: [0.0, 0.010, 0.0]
  offset_x:                   # 몸체 길이 방향(드론 x)으로 5 mm. Iris 몸체는 땅콩 모양이라 허리(x = 0)가 가장 좁아
    tcp_offset: [0.005, 0.0, 0.0]   #   10·20 mm 면 넓은 부분에 손가락 끝(l2)이 걸려 잡는 높이까지 못 올라감 (2026-10-01)
  empty:                      # 드론을 다른 곳에 두고 기본 위치를 향해 잡기 → no_grasp_empty
    drone_offset: [0.0, -0.40, 0.20]
  miss:                       # 잡는 높이를 4 cm 낮춤 (파지면이 몸체 아래) → no_grasp
    tcp_offset: [0.0, 0.0, -0.04]
  drop:                       # 모터 정지 순간부터 그리퍼 힘을 아주 약하게 → 드론 무게에 손가락이 벌어져 떨어짐
    #   (처음부터 약하게 하면 그리퍼가 아예 닫히지 않아 no_grasp_contact)
    #   마찰 0.05 로는 떨어지지 않음 (2026-10-01): 아래에서 잡으면 드론이 손가락 뿌리(r1·l1)에 얹혀 형상으로 받쳐짐
    grip_max_force: 0.05      # Nm (기본 2.28 = 400 mA)
