# =============================================================
# scene_stewart.yaml — 움직이는 베이스 씬: Stewart 플랫폼 위 UR5 (scripts/moving_base_scene.py, PLAN 8단계 S5)
#
# 고정 베이스 씬 (drone_scene.py, scene_drone.yaml) 과 별도. scene_drone.yaml 은 **읽기만** 한다 (시작 자세·조명·테이블 높이)
# world 좌표: 원점 = 가운데 자세의 로봇 base (xy), 바닥 z = 0. 로봇 정면 (base +x) = world +x (드론 쪽)
# 움직임 프리셋은 실행 때 --base-motion small|mid|big|lab (base_stewart.yaml motion.presets)
# 경로는 isaacsim/ 기준 상대 경로. 길이 m, 각도 deg
# =============================================================

base_config: config/base_stewart.yaml
fixed_scene_config: config/scene_drone.yaml   # 읽기만: init_poses, light, table.top_z (third view 위치를 base 기준으로 바꿀 때)

# UR5 robot_mount (= UR5 base_link 원점) 의 윗판 좌표 위치 = 윗판 윗면 가운데 = 회전 중심 (sim 전용 플랫폼이라 임시값 아님)
mount:
  xyz: [0.0, 0.0, 0.0]
  yaw_deg: 0.0                            # 플랫폼 x 축 = 로봇 정면

init_pose: under_drone                    # fixed_scene_config init_poses 의 이름 (그리퍼는 열림)

# 드론 (world 고정 호버). 가운데 자세의 로봇 base 기준 = 고정 씬·Husky 씬과 같은 상대 위치 → world 높이 1.0 + 0.738
drone_base: [0.60, 0.0, 0.738]
drone_flight: geometric                   # moving_base_scene.py 기본 (--check). sim_ros2_moving_base.py 는 --flight (기본 드론 설정 = px4)
px4_surface_z: 0.0                        # PX4 이륙 면 높이 = 바닥 (고정 씬은 테이블 위). 이륙 지점 xy·시간 기준은 fixed_scene_config px4 그대로

# third view 카메라: 고정 씬 설정의 base 기준 위치를 그대로, world 고정 (받침대는 바닥부터)
third_view_camera_config: config/third_view_camera.yaml

# UR5 base 쪽 강체 ↔ Stewart 윗판 충돌 끔 (UR5 바닥이 윗판 윗면에 바로 앉음). 팔 나머지 링크 ↔ 플랫폼 충돌은 그대로
collision_filter:
  robot_links: [robot_mount, base_link_inertia]   # 강체만 (base_link 은 질량 없는 Xform)
