# =============================================================
# drone_simple.yaml — 2단계 데모 드론 (기본 도형 간이 드론, docs/PLAN.md 2단계)
#
# 실물: 접이식 소형 쿼드콥터 (좁고 긴 몸체, 프로펠러 4개), 0.8 kg. 그리퍼가 **아래에서 위로** 다가가 몸체 옆면을 폭 방향으로 잡는다.
# 실물 치수는 모름 (2026-10-01) → 같은 종류 드론의 일반적인 크기로 시작, 실측하면 이 파일만 바꾸고 다시 빌드.
#
# 이 파일 → scripts/build_simple_drone.py → usd (단일 강체, 충돌 형상 = 시각 형상)
# 씬은 drone.add_drone() 으로 usd 를 reference 하고 물체 재질·위치만 씬 레이어에서 정한다.
#
# 좌표: 몸체 좌표계, 원점 = 몸체 박스 중심, +x 앞, +y 왼쪽, +z 위. 단위 m, kg
# =============================================================

usd: assets/drones/simple_drone/simple_drone.usda   # isaacsim/ 기준 상대 경로 (빌드 결과)
name: SimpleDrone                                    # USD defaultPrim 이름

mass: 0.8            # 총 질량 (실물)

body:
  size: [0.18, 0.08, 0.07]   # 길이(x, 앞뒤), 폭(y, 잡는 방향), 높이(z). 폭은 그리퍼 최대 열림(약 107 mm)보다 작아야 함
  color: [0.45, 0.45, 0.48]

# 팔: 몸체 옆면(앞·뒤 끝에서 안쪽으로 inset)에서 모터까지 납작한 박스. 모터 위치 (±motor_x, ±motor_y)
arms:
  motor_x: 0.10
  motor_y: 0.12
  inset: 0.02                # 팔 시작점 = (±(길이/2 − inset), ±폭/2)
  z: 0.02                    # 팔 중심 높이 (몸체 윗면 0.035 아래)
  width: 0.018
  thickness: 0.012
  mass: 0.010                # 하나당
  color: [0.35, 0.35, 0.38]

motors:
  radius: 0.014
  height: 0.022              # 팔 중심 높이에서 위로
  mass: 0.040
  color: [0.15, 0.15, 0.15]

rotors:                      # 프로펠러 회전 원판 (얇은 원기둥)
  radius: 0.065
  thickness: 0.003
  gap: 0.004                 # 모터 위 끝과 원판 사이
  mass: 0.005
  color: [0.1, 0.1, 0.1]

# 다리: 모터 아래로 내려온 짧은 원기둥. 아래 끝이 몸체 바닥보다 clearance 만큼 아래 → 착지 시 몸체가 바닥에 닿지 않음
legs:
  radius: 0.004
  clearance: 0.010
  mass: 0.005
  color: [0.2, 0.2, 0.2]

# 몸체 박스 질량 = mass − (팔 + 모터 + 로터 + 다리) × 4

# 잡는 곳 (정보용, 2-4 파지 시퀀스가 씀): 몸체 옆면, 폭(y) 방향으로 닫음, 아래에서 위로 접근
grasp:
  approach: [0.0, 0.0, 1.0]  # 그리퍼가 움직이는 방향 (몸체 좌표계, 아래 → 위)
  close_axis: [0.0, 1.0, 0.0]
  center_xy: [0.0, 0.0]      # 손가락 중심의 몸체 x, y
