# =============================================================
# scene_drone.yaml — 2단계 드론 파지 씬 배치 (docs/PLAN.md 2-3, scripts/drone_scene.py)
#
# world 좌표, m. 로봇 최상위 prim = (0, 0, 테이블 상판 높이). 로봇은 +x 쪽으로 작업한다
#   (홈 자세 TCP (0.49, 0.11, 1.07) 아래 향함, 관절 0 자세 TCP (0.82, 0.32, 0.76), 2026-10-01 측정)
# =============================================================

table:
  size: [2.0, 1.0]            # x, y (2026-10-01 사용자 결정)
  top_z: 0.762                # 상판 높이 = 로봇 base 높이 (1-4 테스트 씬과 같음)
  center_xy: [0.75, 0.0]      # 로봇이 −x 쪽 끝에서 0.25 m 안쪽
  color: [0.55, 0.45, 0.35]

# 드론 기본 위치 (body 원점, --drone-pos 로 바꿈). 로봇 앞 위쪽, 그리퍼가 아래에서 위로 다가가 잡을 높이.
#   (0.45, 0, 1.40) 은 홈 자세 wrist_1 (0.39, 0.11, 1.28) 에서 약 10 cm 라 너무 가까움 (2026-10-01 third view 영상) → 앞·위로
#   (0.60, 0, 1.50): wrist_1 에서 약 32 cm, 아래에서 잡을 때 손목 중심 높이 약 1.27 m → 어깨에서 약 0.70 m (팔 길이 0.82 m 안)
#   실제로 닿는지는 2-4 (IK) 에서 확인
drone_pos: [0.60, 0.0, 1.50]

light:
  dome_intensity: 1000.0      # 조명이 없으면 카메라 영상이 검게 나옴 → headless 에서도 항상 만든다

third_view_camera_config: config/third_view_camera.yaml
