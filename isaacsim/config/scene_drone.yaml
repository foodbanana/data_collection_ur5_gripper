# =============================================================
# scene_drone.yaml — 2단계 드론 파지 씬 배치 (docs/PLAN.md 2-3, scripts/drone_scene.py)
#
# world 좌표, m. 로봇 최상위 prim = (0, 0, 테이블 상판 높이). 로봇은 +x 쪽으로 작업한다
#   (홈 자세 TCP (0.49, 0.11, 1.07) 아래 향함, 관절 0 자세 TCP (0.82, 0.32, 0.76), 2026-10-01 측정)
# =============================================================

table:
  size: [2.0, 1.0]            # x, y (2026-10-01 사용자 결정)
  top_z: 0.762                # 상판 높이 = 로봇 base 높이 (1-4 테스트 씬과 같음)
  center_xy: [0.75, 0.0]      # 로봇이 −x 쪽 끝에서 0.25 m 안쪽
  color: [0.55, 0.45, 0.35]

# 드론 기본 위치 (body 원점, --drone-pos 로 바꿈). 로봇 앞 위쪽, 그리퍼가 아래에서 위로 다가가 잡을 높이.
#   (0.45, 0, 1.40) 은 홈 자세 wrist_1 (0.39, 0.11, 1.28) 에서 약 10 cm 라 너무 가까움 (2026-10-01 third view 영상) → 앞·위로
#   (0.60, 0, 1.50): wrist_1 에서 약 32 cm, 아래에서 잡을 때 손목 중심 높이 약 1.27 m → 어깨에서 약 0.70 m (팔 길이 0.82 m 안)
#   실제로 닿는지는 2-4 (IK) 에서 확인
drone_pos: [0.60, 0.0, 1.50]

# 이름 붙인 팔 시작 자세 (--init-pose <이름>, sim_ros2.py·drone_scene.py). 팔 6 관절 [rad], shoulder_pan … wrist_3.
#   sim_ros2.py 는 /sim/reset 도 이 자세로 되돌린다. 이름을 안 주면 drive 설정 home_pose
#   under_drone: 드론 아래에서 그리퍼가 위를 보는 자세. 텔레옵 에피소드 시작 자세 (2026-10-12, PLAN 5-B "에피소드 시작 자세"). 그리퍼가 수직 위를 보고, 손목 카메라 렌즈가
#     드론 기본 위치 (drone_pos) 바로 아래 0.42 m → 손목 영상에 드론 몸체·팔·모터가 가운데에 보임 (프로펠러 끝은 잘림). TCP 는 잡는 곳보다 0.30 m 아래.
#     손목 관절 원점이 테이블 위 22.6 cm: 아래로 약 16.8 cm 내려가면 wrist_2 가 테이블에 닿는다. drone_pos 를 바꾸면 다시 구할 것
#     처음 값 [-0.1524, -0.7192, 1.3904, 0.8997, -1.5677, 0.1496] (10 cm 더 아래, 드론 전체가 보임) 은 손을 6.8 cm 만 내려도
#     wrist_2 가 테이블에 닿아 보호 정지 → 10 cm 올림 (2026-10-12 실제 컨트롤러로 텔레옵하다 발견)
#     손목을 뒤집은 팔 자세 (wrist_2 +π/2): 같은 TCP 자세의 [-0.1523, -0.8510, 1.3376, 1.0843, -1.5697, 0.1502] (wrist_2 −π/2) 는
#     손목 마운트가 팔뚝 옆에 있어 그리퍼를 10° 만 기울여도 팔뚝에 닿는다 (보호 정지 force 221 N forearm_link). 뒤집으면 ±30° 까지 닿지 않음
#     2026-10-15 손목 카메라 마운트 t10 (렌즈 옆 −32.5 mm, 10° 기울임, xacro mount_variant) 에 맞춰 다시 구함: 그리퍼 수직 위·TCP 높이 (잡는 곳보다 0.305 m 아래)·
#     손목을 뒤집은 팔 자세는 그대로, TCP 수평 위치만 옮겨 드론 기준 위치가 손목 영상 주점 (332, 239) 에 오게 (TCP 는 드론 기준에서 수평 17 mm, 렌즈 → 드론 0.41 m).
#     손목 관절 원점 22.6 cm (같음), 관절 한계 여유 1.41 rad, 텔레옵 범위 29 자세 × 그리퍼 2 자기 충돌 0.
#     예전 값 [-0.1553, -1.2195, 1.9541, -2.3059, 1.5703, -2.9904] 은 새 카메라에서 드론이 (281, 125) 에 보임 (마운트 original 이면 이 값)
init_poses:
  under_drone: [-0.1889, -1.0776, 1.7304, -2.2242, 1.5700, -2.9566]

# PX4 드론 (flight.backend px4 / --flight px4, PLAN 2단계 2번 P-7): 실물처럼 이륙해서 드론 위치로 감
#   이륙 지점 = 테이블 위 로봇에서 먼 쪽 (x 1.2 m, 상판 위). 수직 상승 → 수평 이동 (로봇 위를 지나지 않게), 경로 내내 아래가 테이블 (거리 센서·flow)
px4:
  takeoff_xy: [1.2, 0.0]
  spawn_above_table: 0.06     # m, body 원점 시작 높이 (다리 끝 약 40 mm → 바닥에 내려앉음)
  connect_timeout: 60.0       # sim s, PX4 부팅·arm 까지
  leg_timeout: 30.0           # sim s, 이동 한 구간 (PX4 추정 위치가 목표 tol 안)
  arrive_tol: 0.05            # m
  settle_time: 5.0            # s, 도착 뒤 호버 안정

light:
  dome_intensity: 1000.0      # 조명이 없으면 카메라 영상이 검게 나옴 → headless 에서도 항상 만든다

third_view_camera_config: config/third_view_camera.yaml
