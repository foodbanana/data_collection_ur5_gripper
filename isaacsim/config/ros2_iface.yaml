# =============================================================
# ros2_iface.yaml — sim ROS 2 인터페이스 (docs/PLAN.md 3단계)
#
# 토픽 이름은 실물과 같다 (PLAN 부록 B). 카메라는 OmniGraph Camera Helper, 나머지는 rclpy (PLAN 3단계 결정 1)
# =============================================================

ros_distro: jazzy                 # python.sh 실행 전에 source /opt/ros/<distro>/setup.bash. 다르면 에러
node_name: isaac_sim              # sim 안 rclpy 노드
loop_hz: 30.0                     # 앱 루프(렌더) 주기 = 카메라 주기. 물리 120 Hz → update 한 번에 물리 4 스텝 (3-1, docs/sim_performance.md)

# 팔 (3-2). 실물 UR 드라이버와 같게: /joint_states = 팔 6 관절 (이름 shoulder_pan_joint … wrist_3_joint), position·velocity·effort
#   sim 은 물리 스텝마다 발행 (120 Hz, 실물 125 Hz). stamp = sim time (SimulationManager.get_simulation_time, 카메라와 같은 시계)
#   effort: 실물 드라이버는 관절 전류 [A], sim 은 관절에 걸린 토크 [Nm] (PhysX projected joint force). stage1 은 effort 를 쓰지 않음
#   /joint_command: 팔 6 관절 이름·position [rad] (텔레옵, sensor_msgs/JointState, QoS 기본 RELIABLE).
#     이름이 팔 6 관절과 다르거나, 길이가 다르거나, 유한하지 않거나, 관절 한계 밖이면 에러로 중단 (조용한 fallback 금지)
arm:
  clock_topic: /clock
  joint_states_topic: /joint_states
  joint_command_topic: /joint_command
  # 명령 보간 (docs/arm_command_interpolation.md): 루프마다 받은 최신 명령으로, 지금 관절 목표에서 새 명령까지 이 시간 동안
  # 물리 스텝(120 Hz)마다 직선 이동 (deoxys LINEAR_JOINT_POSITION 과 같은 방식). 없으면 30 Hz 계단 → 관절이 최대 속도로 뛰었다 멈춤.
  # 루프 한 주기 = 1 / loop_hz. 실물 UR servoJ lookahead (기본 0.1 s) 를 정하면 반응 지연이 비슷해지게 다시 맞출 수 있음
  command_interp_time: 0.033333   # [s]

# 카메라 렌더 (VLA 학습 이미지). Isaac Sim 기본값에 맡기지 않고 명시 (docs/sim_performance.md 7장, 2026-10-02 사용자 결정)
#   RTX 실시간 렌더러는 DLSS(3)·DLAA(4)만 지원. DLSS Performance 는 640x480 을 절반 해상도로 렌더해 키움 —
#   DLAA(원래 해상도) 대비 평균 차이 1/255 이하, RTF 1.01 vs 0.84
#   dlss_exec_mode 는 새 stage 마다 기본값으로 돌아가므로 stage 를 만든 뒤 적용하고 다시 읽어 확인 (ros2_iface.apply_render_settings)
render:
  anti_aliasing: 3                # SimulationApp anti_aliasing: 3 DLSS, 4 DLAA
  dlss_exec_mode: 0               # /rtx/post/dlss/execMode: 0 Performance, 1 Balanced, 2 Quality, 3 Auto

# 그리퍼 (3-3). 실물 rh_gripper_node 와 같게 (README.md, 1DOF_gripper_data_collection.md):
#   /gripper/command  std_msgs/Float64, raw 0(열림) ~ 1150(닫힘). 받은 값을 goal 로 유지(latch) → GripperProfile (실물 Profile Velocity 흉내, 1-5)
#     실물 노드는 0~1150 밖을 clamp 하지만, sim 은 범위 밖·유한하지 않은 값을 에러로 (텔레옵은 0/1150 만 보냄, 조용한 fallback 금지)
#   /gripper/joint_states, /gripper/target  sensor_msgs/JointState, name ['rh_p12_rn'], position [raw]. publish_hz 로 같은 tick·같은 stamp
#     present raw = rh_r1_joint [rad] × raw_max / upper, 0~raw_max clamp (실물 노드와 같음). target = 마지막 goal raw
#     발행 시각은 sim time 의 1/publish_hz 배수 (카메라 30 Hz stamp 와 같은 물리 스텝)
#   시작 시 열림(0) (build_scene 이 그리퍼를 0 으로 리셋)
gripper:
  command_topic: /gripper/command
  joint_states_topic: /gripper/joint_states
  target_topic: /gripper/target
  joint_name: rh_p12_rn
  publish_hz: 30.0

# 보호 정지 흉내 (3-7, docs/PLAN.md 3단계 "보호 정지"). UR 보호 정지 = Cat 2 (감속 후 정지 유지) 흉내:
#   물리 스텝마다 검사, 하나라도 넘으면 팔 목표를 현재 위치에 고정하고 이후 /joint_command 무시 (그리퍼 명령은 계속 받음), 해제는 리셋 서비스
#   topic: std_msgs/Bool, 그리퍼 토픽과 같은 1/30 s 배수 시각에 계속 발행 (녹화 → 에피소드 protective_stop 표시)
#   기준값은 임시 (UR 문서에 숫자가 없는 것은 임의). 정상 동작 최댓값을 재서 여유를 확인 (sim_ros2 --protective-stop measure)
protective_stop:
  topic: /protective_stop
  contact_force_n: 150.0          # 링크 접촉력 [N] (UR 예시 힘 한계 150 N)
  #   손가락이 아닌 링크: 모든 물체와의 순 접촉력. 손가락 링크: environment_paths 와의 접촉만
  #   (드론을 쥐는 힘·빈손으로 닫을 때 손가락끼리 닿는 힘은 외력이 아님. 손가락으로 테이블을 찍는 충돌은 잡아야 함, 2026-10-05 측정)
  # 2026-10-05 측정 (docs/arm_command_interpolation.md 5.3, 보간 후): 정상 최대 = 접촉 0 N, 오차 0.7° (텔레옵 속도) · 2.9° (최대 속도 근처),
  #   관절 속도 180 °/s (= drive 최대 속도). 테이블 충돌 = 손가락 끝 317 N, 오차 47.7°
  tracking_error_deg: 5.0         # 관절 목표 − 측정 [°] (UR 숫자 미공개. 정상 최대 2.9° 위로)
  joint_speed_dps: 200.0          # 관절 속도 [°/s] (관절각 차분). drive 최대 속도 180 °/s (URDF π rad/s) 보다 위 → 충격으로만 넘음
  finger_links: [rh_p12_rn_r1, rh_p12_rn_r2, rh_p12_rn_l1, rh_p12_rn_l2]
  environment_paths: [/World/Table, /World/GroundPlane, /World/ThirdView/mount_plate, /World/ThirdView/mount_post]

# 에피소드 리셋 서비스 (3-6, sim_reset.py). std_srvs/Trigger, 끝날 때까지 sim 을 실제 시간 속도로 돌린 뒤 응답 (message = JSON)
#   실패하면 success=False + 이유 (sim 은 계속). 다음 리셋이 성공할 때까지 팔·그리퍼 명령을 무시한다 (다시 호출해 재시도)
#   항상 같은 경로 (순간이동, 2026-10-05 사용자 결정): 명령 무시 → 보호 정지 해제 → 드론 kill → 이륙 지점으로 순간이동 + PX4 재시작
#     → 팔·그리퍼 홈·열림으로 순간이동 → 재이륙 → 새 호버 위치 (약 30 s). 기하 제어기 드론은 새 위치로 순간이동 후 다시 켬
#   새 호버 위치 = 씬 drone_pos + 균등분포 ±drone_offset (x, y, z 각각), 시드 = --seed + 리셋 횟수 (응답·로그에 기록)
reset:
  service: /sim/reset
  kill_service: /sim/drone_kill   # 드론 모터 정지 (std_srvs/Trigger, 잡은 뒤. record_toggle.py --sim 의 k 키). 다시 켜는 것은 리셋
  drone_offset: 0.05              # [m]. sim_ros2 --reset-offset 으로 바꿀 수 있음 (0 = 항상 기준 위치)
  kill_timeout: 3.0               # [s] 날고 있는 PX4 드론 kill 뒤 disarm 확인까지

cameras:
  tick_rate: 30.0                 # [Hz] 카메라 prim omni:sensor:tickRate (렌더·발행 주기). 실물 RealSense color 30 Hz
  # frame_id: realsense-ros 규칙 <카메라>_color_optical_frame. 실물 wrapper 값은 실물 PC 에서 확인 필요 (PLAN 3단계)
  wrist:
    topic: /cam/wrist/color/image_raw
    info_topic: /cam/wrist/color/camera_info
    frame_id: wrist_camera_color_optical_frame
  third_view:
    topic: /cam/third_view/color/image_raw
    info_topic: /cam/third_view/color/camera_info
    frame_id: third_view_camera_color_optical_frame
