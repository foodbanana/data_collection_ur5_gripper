# =============================================================
# xr_teleop.yaml — PICO 4 Ultra 팔 텔레옵 노드 설정 (teleop/xr_teleop_node.py, docs/PLAN.md 5-B B-2)
#
# 값은 2026-10-12 결정 (PLAN 5-B). 항목이 빠지면 노드가 에러로 멈춘다 (기본값을 코드에 두지 않는다)
# =============================================================

rate_hz: 60.0                 # /joint_command 를 보내는 주기 (자기 타이머, wall). 요구: 50 Hz 이상으로 일정하게. 컨트롤러 값은 90 Hz 로 온다

# /joint_command 의 header.stamp
#   sim  : 가장 최근에 받은 /clock (sim time). sim 은 루프 (30 Hz) 마다 최신 명령을 쓰므로, 같은 루프 안에 보낸 명령은 stamp 가 같을 수 있다
#   wall : PC 시각 (실물)
stamp: sim

topics:
  joint_states: /joint_states
  joint_command: /joint_command
  gripper_command: /gripper/command
  clock: /clock
  protective_stop: /protective_stop     # sim 전용 (std_msgs/Bool). 발행자가 없으면 쓰지 않는다
  request: /teleop/request              # 녹화 도구 요청 (std_msgs/String, 아래 buttons). 녹화하지 않는다 (record_toggle.py TELEOP_REQUEST_TOPIC 과 같아야 함)

# 컨트롤러 → TCP
hand: right                   # 오른손 컨트롤러의 자세·트리거를 쓴다
scale: 0.9                    # 손 이동 : TCP 이동 (1 = 같은 거리). 위치에만 적용, 회전은 1 : 1. 2026-10-14 사용자: 1.0 → 0.9 (조금 느리게)
rotation: true                # 손목 회전도 TCP 가 따라감 (false = 위치만, 자세는 시작할 때 그대로)
# 텔레옵 버튼 (teleop_button) 을 누른 순간 컨트롤러 앞쪽 (자기 좌표계 −z) 을 수평면에 내린 방향이 "앞" = 로봇 base +x, 위 (+y) = base +z.
# 컨트롤러 끝이 수평에서 이 각도보다 더 들리거나 숙여져 있으면 "앞" 을 정할 수 없어 시작을 거부한다
max_start_elevation_deg: 60.0

# IK (teleop/ik_model.py ik_step)
max_joint_speed: 1.5          # [rad/s] 관절 목표가 움직이는 최대 속도 (sim 관절 최대 π rad/s 아래)
max_lead: 0.08                # [rad] 관절 목표가 측정 관절각보다 앞설 수 있는 최대 (4.6°. sim 보호 정지 위치 오차 5° 아래)
damping: 0.02                 # damped least squares λ
limit_margin: 0.05            # [rad] 관절 한계 안쪽 여유 (sim 은 한계 밖 명령을 받으면 에러로 끝난다)
warn_pos_err: 0.05            # [m] TCP 목표가 명령 자세보다 이만큼 넘게 앞서 있으면 알림 (손이 팔보다 빠르거나 팔이 못 가는 곳)
warn_manip: 0.01              # 특이점 지표 sqrt(det(J Jᵀ)) 가 이보다 작으면 알림 (under_drone 자세에서 약 0.087)

# 컨트롤러 자세 필터: One Euro (Casiez et al. 2012). 차단 주파수 = min_cutoff + beta × (거른) 속도
#   손이 멈춰 있으면 min_cutoff 로 강하게 (떨림 제거), 빠를수록 약하게 (지연 줄임). 텔레옵 시작 (teleop_button) 때 그 자리 값으로 초기화
#   2026-10-14 사용자: 떨림이 크지 않아 가볍게 걸어 보기로. 값은 만든 손 움직임으로 비교해 고름 (PLAN 5-B "컨트롤러 필터"):
#     멈춘 손 떨림 1 mm → 0.43 mm, 추가 지연 3 cm/s 32 ms (1 mm), 15 cm/s 13 ms, 50 cm/s 6 ms
#   조작감 값이다: 수집 도중에 바꾸지 않는다 (바꾸면 새 작업명으로). 끄려면 enabled: false
filter:
  enabled: true
  pos_min_cutoff_hz: 1.5       # [Hz] 손이 멈췄을 때의 차단 주파수 (작을수록 떨림을 더 잡지만 느린 움직임이 늦어짐)
  pos_beta: 40.0               # [Hz/(m/s)] 손 속도 1 m/s 당 차단 주파수 증가 (클수록 빠른 움직임의 지연이 줄어듦)
  rot_min_cutoff_hz: 1.5       # [Hz] 자세 (손목 회전) 의 같은 값
  rot_beta: 10.0               # [Hz/(rad/s)]
  d_cutoff_hz: 1.0             # [Hz] 속도 추정에 거는 저역 필터

# 테이블 보호: 손목 관절 (wrist_1·2·3) 원점의 높이 [m, 로봇 base 기준 z. base = 테이블 상판] 가 이 값 아래로 더 내려가는 관절 목표는 보내지 않고 알린다
#   (올라가는 쪽은 막지 않는다). sim 측정 (2026-10-12): wrist_2 원점이 0.058 m 까지 내려오면 wrist_2 링크가 테이블에 닿아 보호 정지 (접촉 200 N)
#   → 0.09 = 닿기 약 3 cm 전. 테이블이 없는 배치면 큰 음수로
min_wrist_height: 0.09

# 그리퍼: 트리거 (0 ~ 1) 를 이진으로. close 를 넘으면 닫힘, open 아래로 내려가면 열림 (그 사이는 그대로 = 히스테리시스)
gripper:
  close_above: 0.6
  open_below: 0.4
  raw_open: 0.0
  raw_close: 1150.0

# 컨트롤러 버튼 (2026-10-14 결정). A·B 는 오른손, X·Y 는 왼손 (헤드셋 앱에서 왼손 컨트롤러도 Send). 누르는 순간 한 번
# 녹화 순서: B 리셋 → Y 텔레옵 시작 → 자세 유지 → A 녹화 시작 → 잡기 → X 모터 정지 → A 녹화 끝 → B 다음 에피소드
teleop_button: Y             # 텔레옵 시작 / 멈춤 (누른 순간의 오른손 컨트롤러 자세가 기준. 녹화와 무관)
# 녹화 도구 (record_toggle.py) 요청 (/teleop/request). 텔레옵 중이 아니어도 보낸다. 끄려면 {}
#   record     : 녹화 시작 / 종료 (리셋하지 않는다. 시작은 리셋 뒤 아직 녹화하지 않았을 때만)
#   reset      : 에피소드 리셋 (/sim/reset, 약 24 s). 녹화 중이면 실패로 보고 녹화를 끝내 bags/_discarded/ 로 옮긴 뒤 리셋
#   drone_kill : 드론 모터 정지 (= 녹화 도구 k, 언제든. 녹화 중이면 시각이 episode.json 에 남는다)
buttons:
  record: A
  reset: B
  drone_kill: X

# 입력·상태 확인 (wall 시간)
xr_connect_timeout: 5.0       # [s] 시작할 때 헤드셋 데이터 (타임스탬프 증가, 쿼터니언 크기 1) 가 이 안에 와야 한다. 아니면 에러로 끝남
xr_stale_warn: 0.5            # [s] 헤드셋 타임스탬프가 이만큼 멈추면 알림만 한다 (팔은 마지막 목표에 머문다. 자동 판정 안 함, PLAN 5-B 안전 장치)
state_stale: 0.5              # [s] /joint_states (sim 이면 /clock 도) 가 이만큼 안 오면 시작을 거부하고, 텔레옵 중이면 멈춘다
# 측정 관절각이 관절 목표와 이만큼 넘게 다르면 텔레옵을 멈춘다 (/sim/reset 이 팔을 순간이동했거나 보호 정지로 팔이 멈춤).
# 계속 보내면 팔이 옛 목표로 뛴다. 정상 추종에서는 max_lead 를 넘지 않는다
desync: 0.2                   # [rad]
status_sec: 5.0               # [s] 텔레옵 중 상태 한 줄 출력 주기
